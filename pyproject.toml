[project]
name = "fda-recall"
version = "0.1.0"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ruff defaults (pyflakes + pycodestyle errors) plus import sorting; explicit so user-level configs don't change results
select = ["E4", "E7", "E9", "F", "I"]
