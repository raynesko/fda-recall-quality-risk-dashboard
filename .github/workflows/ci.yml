name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt && pip install -e .
      - run: ruff check .
      # Tests that need the processed openFDA data skip in CI (data/ is regenerated locally, not committed).
      - run: pytest -q
      # Power BI project files vs Microsoft's published PBIR JSON schemas.
      - run: python scripts/validate_pbir.py
